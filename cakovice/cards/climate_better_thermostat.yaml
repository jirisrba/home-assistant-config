# ==============================================================================
# DASHBOARD KARTA: BETTER THERMOSTAT (HACS)
# ==============================================================================

type: vertical-stack
cards:
  # --- 1. OVLÁDÁNÍ TERMOSTATICKÝCH HLAVIC ---
  - type: grid
    title: Termostaty & Vytápění
    columns: 3
    square: false
    cards:
      # Obývák
      - type: custom:better-thermostat-normal-climate-card
        entity: climate.bedroom_sonoff_trv_zbt_obyvak
        name: Obývák

      # Pokojík
      - type: custom:better-thermostat-normal-climate-card
        entity: climate.kids_room_sonoff_trv_zbt_pokojik
        name: Pokojík

      # Koupelna
      - type: custom:better-thermostat-normal-climate-card
        entity: climate.bathroom_sonoff_trv_zbt_koupelna
        name: Koupelna

  # --- 2. TEPLOTA A VLHKOST (Senzory SNZB-02D) ---
  - type: grid
    title: Doplňkové senzory prostředí
    columns: 2
    square: false
    cards:
      # Kuchyně
      - type: tile
        entity: sensor.kitchen_sonoff_snzb_02d_temperature
        name: Kuchyně – Teplota
        icon: mdi:thermometer
        color: orange
      - type: tile
        entity: sensor.kitchen_sonoff_snzb_02d_humidity
        name: Kuchyně – Vlhkost
        icon: mdi:water-percent
        color: blue

      # Obývák
      - type: tile
        entity: sensor.bedroom_shelly_htg3_shelly_htg3_temperature
        name: Obývák – Teplota
        icon: mdi:thermometer
        color: orange
      - type: tile
        entity: sensor.bedroom_shelly_htg3_shelly_htg3_humidity
        name: Obývák – Vlhkost
        icon: mdi:water-percent
        color: blue

      # Pokojík
      - type: tile
        entity: sensor.kids_room_sonoff_snzb_02d_temperature
        name: Pokojík – Teplota (SNZB)
        icon: mdi:thermometer
        color: orange
      - type: tile
        entity: sensor.kids_room_sonoff_snzb_02d_humidity
        name: Pokojík – Vlhkost
        icon: mdi:water-percent
        color: blue

      - type: tile
        entity: sensor.kids_room_xiaomi_lywsd03mmc_temperature
        name: Pokojík – Teplota (Xiaomi)
        icon: mdi:thermometer
        color: orange
      - type: tile
        entity: sensor.kids_room_xiaomi_lywsd03mmc_humidity
        name: Pokojík – Vlhkost (Xiaomi)
        icon: mdi:water-percent
        color: blue

  # --- 3. HISTORIE TEPLOT (24h) ---
  - type: history-graph
    title: Vývoj teplot za posledních 24 hodin
    hours_to_show: 24
    entities:
      - entity: sensor.kitchen_sonoff_snzb_02d_temperature
        name: Kuchyně
      - entity: sensor.bedroom_shelly_htg3_shelly_htg3_temperature
        name: Obývák
      - entity: sensor.kids_room_sonoff_snzb_02d_temperature
        name: Pokojík (SNZB)
      - entity: sensor.kids_room_xiaomi_lywsd03mmc_temperature
        name: Pokojík (Xiaomi)

  # --- 4. STAV BATERIÍ ZAŘÍZENÍ ---
  - type: entities
    title: Stav baterií
    show_header_toggle: false
    entities:
      - entity: sensor.kitchen_sonoff_snzb_02d_battery
        name: Teploměr Kuchyně
      - entity: sensor.kids_room_sonoff_snzb_02d_battery
        name: Teploměr Pokojík (SNZB)
      - entity: sensor.kids_room_sonoff_trv_zbt_pokojik_battery
        name: Hlavice Pokojík
      - entity: sensor.bedroom_sonoff_trv_zbt_obyvak_battery
        name: Hlavice Obývák
      - entity: sensor.bathroom_sonoff_trv_zbt_koupelna_battery
        name: Hlavice Koupelna
