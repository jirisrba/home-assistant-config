      id: "zapnout_vecer"
    - platform: time
      at: "22:00:00"
      id: "vypnout_noc"
  action:
    - choose:
        # ZAPNOUT TOPENÍ (ráno nebo večer)
        - conditions:
            - condition: trigger
              id:
                - zapnout_rano
                - zapnout_vecer
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.kids_room_sonoff_trv_zbt_pokojik
