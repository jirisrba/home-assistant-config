# ==============================================================================
# TOPENÍ: KOUPELNA (Pouze večer 16:00 - 20:00, jinak vypnuto)
# ==============================================================================
- id: heating_koupelna_schedule
  alias: "Topení: Koupelna (večer 16:00 - 20:00)"
  trigger:
    - platform: time
      at: "16:00:00"
      id: "koupelna_zapnout"
    - platform: time
      at: "20:00:00"
      id: "koupelna_vypnout"
  action:
    - choose:
        # 16:00 - ZAPNOUT
        - conditions:
            - condition: trigger
              id: koupelna_zapnout
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.bathroom_sonoff_trv_zbt_koupelna
              data:
                hvac_mode: heat
            - action: climate.set_temperature
              target:
                entity_id: climate.bathroom_sonoff_trv_zbt_koupelna
              data:
                temperature: 23.0

        # 20:00 - VYPNOUT
        - conditions:
            - condition: trigger
              id: koupelna_vypnout
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.bathroom_sonoff_trv_zbt_koupelna
              data:
                hvac_mode: "off"
