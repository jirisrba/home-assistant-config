---
# automations.yaml

# ==============================================================================
# WC LIGHT: Zapnout světlo WC při otevření dveří
# ==============================================================================
- id: turn_on_wc_light
  alias: "Light WC on"
  trigger:
    - platform: state
      entity_id: binary_sensor.wc_ewelink_ms01
      from: "off"
      to: "on"
  condition:
    - condition: state
      entity_id: switch.wc_sonoff_t1_wc_wc_light
      state: "off"
    - condition: time
      after: "07:00:00"
      before: "20:00:00"
  action:
    - service: switch.turn_on
      entity_id: switch.wc_sonoff_t1_wc_wc_light

# ==============================================================================
# TOPENÍ: OBÝVÁK (Harmonogram podle Netatmo)
# ==============================================================================
- id: heating_obyvak_schedule
  alias: "Topení: Obývák"
  trigger:
    # Pracovní dny: ráno komfort (06:00 - 07:30)
    - platform: time
      at: "06:00:00"
      id: rano_pracovni
    - platform: time
      at: "07:30:00"
      id: utlum_den_pracovni
    # Víkend: ráno komfort (07:45 - 09:00)
    - platform: time
      at: "07:45:00"
      id: rano_vikend
    - platform: time
      at: "09:00:00"
      id: utlum_den_vikend
    # Každý den: večer komfort (17:00 - 20:00)
    - platform: time
      at: "17:00:00"
      id: vecer_komfort
    # Každý den: noc útlum (20:00)
    - platform: time
      at: "20:00:00"
      id: utlum_noc
  action:
    - choose:
        # KOMFORT: 21.5 °C (Po-Pá 06:00-07:30, So-Ne 07:45-09:00, Po-Ne 17:00-20:00)
        - conditions:
            - condition: or
              conditions:
                - condition: and
                  conditions:
                    - condition: trigger
                      id: rano_pracovni
                    - condition: time
                      weekday:
                        - mon
                        - tue
                        - wed
                        - thu
                        - fri
                - condition: and
                  conditions:
                    - condition: trigger
                      id: rano_vikend
                    - condition: time
                      weekday:
                        - sat
                        - sun
                - condition: trigger
                  id: vecer_komfort
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.obyvak
              data:
                hvac_mode: heat
            - action: climate.set_temperature
              target:
                entity_id: climate.obyvak
              data:
                temperature: 21.5

        # ÚTLUM: 18.0 °C (přes den a v noci)
        - conditions:
            - condition: or
              conditions:
                - condition: and
                  conditions:
                    - condition: trigger
                      id: utlum_den_pracovni
                    - condition: time
                      weekday:
                        - mon
                        - tue
                        - wed
                        - thu
                        - fri
                - condition: and
                  conditions:
                    - condition: trigger
                      id: utlum_den_vikend
                    - condition: time
                      weekday:
                        - sat
                        - sun
                - condition: trigger
                  id: utlum_noc
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.obyvak
              data:
                hvac_mode: heat
            - action: climate.set_temperature
              target:
                entity_id: climate.obyvak
              data:
                temperature: 18.0

