# ==============================================================================
# TOPENÍ: OBÝVÁK (Ráno a večer topit, jinak vypnuto)
# ==============================================================================
- id: heating_obyvak_schedule
  alias: "Topení: Obývák (ráno a večer)"
  trigger:
    - platform: time
      at: "06:00:00"
      id: "zapnout_rano"
    - platform: time
      at: "08:30:00"
      id: "vypnout_den"
    - platform: time
      at: "16:00:00"
      id: "zapnout_vecer"
    - platform: time
      at: "22:00:00"
      id: "vypnout_noc"
  action:
    - choose:
        # ZAPNOUT TOPENÍ (ráno nebo večer)
        - conditions:
            - condition: trigger
              id:
                - zapnout_rano
                - zapnout_vecer
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.bedroom_sonoff_trv_zbt_obyvak
              data:
                hvac_mode: heat
            - action: climate.set_temperature
              target:
                entity_id: climate.bedroom_sonoff_trv_zbt_obyvak
              data:
                temperature: 21.5

        # VYPNOUT TOPENÍ (přes den nebo na noc)
        - conditions:
            - condition: trigger
              id:
                - vypnout_den
                - vypnout_noc
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.bedroom_sonoff_trv_zbt_obyvak
              data:
                hvac_mode: "off"

# ==============================================================================
# TOPENÍ: POKOJÍK (Ráno a večer topit, jinak vypnuto)
# ==============================================================================
