---
# automations.yaml

- id: baterie_nizke_soc
  alias: "Baterie – nízké SOC"
  description: "Upozornění při poklesu SOC pod 20 %"
  trigger:
    - platform: numeric_state
      entity_id: sensor.growatt_battery_battery_soc
      below: 20
      for:
        minutes: 5
  action:
    - service: telegram_bot.send_message
      data:
        title: "⚡ FVE chalupa"
        message: "SOC baterie kleslo pod 20 % (aktuálně {{ states('sensor.growatt_battery_battery_soc') }} %). Blíží se přepnutí na síť."
  mode: single

- id: switch_mycka_on
  alias: "Mycka - zapni"
  description: "Zapni mycku kdyz SOC > 50, v poledne, nebo solar > 1kW po dobu 5 min"
  trigger:
    - platform: numeric_state
      entity_id: sensor.growatt_battery_battery_soc
      above: 50
    - platform: time
      at: "12:00:00"
    - platform: numeric_state
      entity_id: sensor.growatt_solar_solar_total_power
      above: 1500
      for:
        minutes: 5
  condition:
    - condition: state
      entity_id: switch.mycka
      state: "off"
  action:
    - service: switch.turn_on
      entity_id: switch.mycka

- id: switch_mycka_off
  alias: "Mycka - vypni"
  description: "Vypni mycku kdyz SOC < 35 v noci (20:00-12:00)"
  trigger:
    - platform: numeric_state
      entity_id: sensor.growatt_battery_battery_soc
      below: 35
  condition:
    - condition: state
      entity_id: switch.mycka
      state: "on"
    - condition: numeric_state
      entity_id: sensor.mycka_power
      below: 10
  action:
    - service: switch.turn_off
      entity_id: switch.mycka

# =============================================================================
# WATCHDOG - RS485 prevodnik restart
# Pokud je sensor nedostupny 5+ minut a switch.gbo je zapnuty,
# provede restart vypnutim/zapnutim switch.gbo (power-cycle prevodniku).
# mode: single zajisti ze bezi max jeden restart najednou.
# =============================================================================

- id: watchdog_rs485_growatt
  alias: "Watchdog - RS485 restart (Growatt SOC nedostupny)"
  description: >
    Pokud je sensor.growatt_battery_battery_soc nedostupny 5 minut,
    restartuje modbus TCP/RTU bridge pres button.
  trigger:
    - platform: state
      entity_id: sensor.growatt_battery_battery_soc
      to: "unavailable"
      for:
        minutes: 5
  condition: []
  action:
    - alias: "Loguj restart"
      service: system_log.write
      data:
        message: "Watchdog: Growatt SOC nedostupny 5 min, restartuji modbus bridge"
        level: warning
    - alias: "Restart modbus TCP/RTU bridge"
      service: button.press
      target:
        entity_id: button.modbus_tcp_rtu_bridge_restart
    - alias: "Cekej az se sensor obnovi (max 10 min)"
      wait_for_trigger:
        - platform: state
          entity_id: sensor.growatt_battery_battery_soc
          not_to:
            - "unavailable"
            - "unknown"
      timeout:
        minutes: 10
      continue_on_timeout: true
  mode: single
  max_exceeded: silent

- id: watchdog_rs485_gbo
  alias: "Watchdog - RS485 restart (GBO SOC nedostupny)"
  description: >
    Pokud je sensor.gbo_battery_soc nedostupny 5 minut,
    restartuje GBO pres solar switch (power-cycle)
    Plati jen kdyz je switch.gbo zapnuty.
  trigger:
    - platform: state
      entity_id: sensor.gbo_battery_soc
      to: "unavailable"
      for:
        minutes: 5
  condition:
    - condition: state
      entity_id: switch.gbo
      state: "on"
  action:
    - alias: "Loguj restart"
      service: system_log.write
      data:
        message: "Watchdog: GBO SOC nedostupny 5 min, restartuji solar switch"
        level: warning
    - alias: "Vypni solar switch"
      service: switch.turn_off
      target:
        entity_id: switch.gbo
    - alias: "Cekej 5 sekund"
      delay:
        seconds: 5
    - alias: "Zapni solar switch"
      service: switch.turn_on
      target:
        entity_id: switch.gbo
    - alias: "Cekej az se sensor obnovi (max 10 min)"
      wait_for_trigger:
        - platform: state
          entity_id: sensor.gbo_battery_soc
          not_to:
            - "unavailable"
            - "unknown"
      timeout:
        minutes: 10
      continue_on_timeout: true
  mode: single
  max_exceeded: silent

- id: gbo_modbus_stop_sunset
  alias: "GBO modbus stop - switch.gbo off"
  trigger:
    - platform: state
      entity_id: switch.gbo
      to: "off"
  action:
    - action: modbus.stop
      data:
        hub: greenbono


- id: gbo_modbus_start_sunrise
  alias: "GBO modbus start - switch.gbo on"
  trigger:
    - platform: state
      entity_id: switch.gbo
      to: "on"
  mode: single
  action:
    - action: modbus.reload

    - delay: "00:00:10"

    # reg 0: minute<<8 | second
    - action: modbus.write_register
      data:
        hub: greenbono
        unit: 3
        address: 0
        value: >-
          {{ (now().minute * 256 + now().second) | int }}

    # reg 1: wday<<8 | hour
    - action: modbus.write_register
      data:
        hub: greenbono
        unit: 3
        address: 1
        value: >-
          {{ ((now().isoweekday() % 7) * 256 + now().hour) | int }}

# =============================================================================
# GROWATT - synchronizace času a data střídače (Growatt SPF 6000 ES PLUS)
# =============================================================================

- id: growatt_clock_sync_weekly
  alias: "Growatt – týdenní synchronizace času střídače"
  description: >-
    Jednou týdně (v neděli ve 03:30) synchronizuje datum a čas střídače Growatt SPF 6000 ES PLUS.
    Využívá oficiální akci growatt_modbus.sync_inverter_time s kontrolou odchylky (min_drift_seconds: 10),
    aby se šetřily zápisy do EEPROM paměti střídače.
  trigger:
    - platform: time
      at: "03:30:00"
  condition:
    - condition: time
      weekday:
        - sun
  action:
    - alias: "Synchronizuj čas střídače Growatt"
      action: growatt_modbus.sync_inverter_time
      data:
        device_id: "{{ device_id('sensor.growatt_battery_battery_soc') }}"
        min_drift_seconds: 10
      response_variable: clock
    - alias: "Zaloguj výsledek do system_log"
      service: system_log.write
      data:
        message: >-
          Growatt time sync: zapsáno={{ clock.written }}, odchylka={{ clock.drift_seconds }}s (střídač: {{ clock.inverter_time }}, HA: {{ clock.home_assistant_time }})
        level: info
  mode: single

