# ==============================================================================
# DASHBOARD KARTA: BETTER THERMOSTAT (HACS)
# ==============================================================================
# V novějších verzích Better Thermostat UI Card (v3+) byl název karty změněn na:
# custom:better-thermostat-normal-climate-card
# (starý název custom:better-thermostat-ui-card házel "Configuration error")
#
# Pokud se stále zobrazuje chyba:
# 1. Tvrdě obnovte stránku (Cmd+Shift+R na Macu / Ctrl+F5)
# 2. V HACS -> Frontend zkontrolujte, že je "Better Thermostat UI Card" stažená
# ==============================================================================

type: vertical-stack
cards:
  # --- 1. OVLÁDÁNÍ TERMOSTATICKÝCH HLAVIC ---
  - type: grid
    title: Termostaty & Vytápění
    columns: 3
    square: false
    cards:
      # Pokojík
      - type: custom:better-thermostat-normal-climate-card
        entity: climate.kids_room_sonoff_trv_zbt_pokojik
        name: Pokojík

      # Obývák
      - type: custom:better-thermostat-normal-climate-card
        entity: climate.bedroom_sonoff_trv_zbt_obyvak
        name: Obývák

      # Koupelna
      - type: custom:better-thermostat-normal-climate-card
        entity: climate.bathroom_sonoff_trv_zbt_koupelna
        name: Koupelna

  # --- 2. TEPLOTA A VLHKOST (Senzory SNZB-02D) ---
  - type: grid
    title: Doplňkové senzory prostředí
    columns: 2
    square: false
    cards:
      # Kuchyně
      - type: tile
        entity: sensor.kitchen_sonoff_snzb_02d_temperature
        name: Kuchyně – Teplota
        icon: mdi:thermometer
        color: orange
      - type: tile
        entity: sensor.kitchen_sonoff_snzb_02d_humidity
        name: Kuchyně – Vlhkost
        icon: mdi:water-percent
        color: blue

      # Pokojík
      - type: tile
        entity: sensor.kids_room_sonoff_snzb_02d_temperature
        name: Pokojík – Teplota (SNZB)
        icon: mdi:thermometer
        color: orange
      - type: tile
        entity: sensor.kids_room_sonoff_snzb_02d_humidity
        name: Pokojík – Vlhkost
        icon: mdi:water-percent
        color: blue

  # --- 3. HISTORIE TEPLOT (24h) ---
  - type: history-graph
    title: Vývoj teplot za posledních 24 hodin
    hours_to_show: 24
    entities:
      - entity: sensor.kitchen_sonoff_snzb_02d_temperature
        name: Kuchyně (senzor)
      - entity: sensor.kids_room_sonoff_snzb_02d_temperature
        name: Pokojík (senzor)
      - entity: climate.kids_room_sonoff_trv_zbt_pokojik
        name: Pokojík (hlavice)
      - entity: climate.bedroom_sonoff_trv_zbt_obyvak
        name: Obývák (hlavice)
      - entity: climate.bathroom_sonoff_trv_zbt_koupelna
        name: Koupelna (hlavice)
